name: Nightly edition

on:
  schedule:
    - cron: "17 11 * * *"   # 11:17 UTC daily (early morning in the U.S.)
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Build today's edition
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
          BN_BASE_URL: https://boringnews.org
        run: python -m boringnews.pipeline run
      - name: Keep the database (editions accumulate)
        run: |
          git config user.name "boringnews-bot"
          git config user.email "boringnews-bot@users.noreply.github.com"
          git add -f data/boringnews.db
          git commit -m "Edition $(date -u +%F)" || echo "no changes"
          git push
      - name: Export static site
        env:
          BN_BASE_URL: https://boringnews.org
        run: python -m boringnews.export_static --out site --cname boringnews.org
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
