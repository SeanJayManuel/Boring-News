name: Nightly edition

on:
  schedule:
    - cron: "17 11 * * *"   # 11:17 UTC daily (early morning in the U.S.)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  edition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -r requirements.txt
      - run: npm ci        # jsdom, for the page tests
      - run: pytest -q

      # The edition files in archive/ are the project's storage; the database is rebuilt from them.
      - name: Rebuild the database from past editions
        run: python -m boringnews.archive restore

      - uses: actions/cache@v4
        with:
          path: data/models   # the grouping model, about 90 MB
          key: grouping-all-MiniLM-L6-v2

      - name: Build today's edition
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          BN_BASE_URL: https://standardedition.org
        run: python -m boringnews.pipeline run --require-writer

      - name: Commit today's edition file
        run: |
          git config user.name "standard-edition-bot"
          git config user.email "standard-edition-bot@users.noreply.github.com"
          git add archive/
          git commit -m "Edition $(date -u +%F)" || echo "no changes"
          git push

      - name: Export the site
        env:
          BN_BASE_URL: https://standardedition.org
        run: python -m boringnews.export_static --out site

      # Static files plus functions/feed.xml.js, which builds custom feeds.
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 pages deploy site --project-name standard-edition --branch main
